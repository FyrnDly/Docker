services:
  # MySQL Database
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Jakarta
    ports:
      - "${MYSQL_PORT}:3306"
    deploy:
      resources:
          limits:
              cpus: "2.00"
              memory: "2G"
          reservations:
              cpus: "1.00"
              memory: "512M"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    networks:
      - fyrn
