services:
  postgres:
    build:
      context: .
      dockerfile: deployment/postgres/Dockerfile
    container_name: psql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      TZ: Asia/Jakarta
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - psql_data:/var/lib/postgresql/data
    restart: always
    networks:
      - fyrn