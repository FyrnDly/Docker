services:
  postgres:
    build:
      context: .
      dockerfile: deployment/postgres/Dockerfile
    container_name: psql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      TZ: Asia/Jakarta
    ports:
      - "${POSTGRES_PORT}:5432"
    deploy:
      resources:
          limits:
              cpus: "2.00"
              memory: "4G"
          reservations:
              cpus: "1"
              memory: "2G"
    volumes:
      - psql_data:/var/lib/postgresql/data
    restart: always
    networks:
      - fyrn