services:
  collabora:
    image: collabora/code:latest
    container_name: collabora
    restart: always
    ports:
      - "${COLLABORA_PORT}:9980"
    environment:
      - aliasgroup1=http://*:*
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
      - DONT_GEN_SSL_CERT=1
    cap_add:
      - MKNOD
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "2G"
        reservations:
          cpus: "0.25"
          memory: "512M"
    networks:
      - fyrn
